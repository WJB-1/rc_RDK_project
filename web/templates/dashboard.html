<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboCup Navigation 2.0</title><link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"></head>
<body>
<header class="topbar"><strong>RoboCup Rescue Brain</strong><span id="connection">离线</span><span id="clock">--</span></header>
<main class="layout"><span class="sr-only">RuntimeMap</span>
<section class="panel navigation-panel" id="navigation-panel"><h2>导航状态</h2><div class="state-card"><span>主状态</span><b id="nav-state">--</b></div><div class="state-card"><span>当前动作</span><b id="current-action">--</b></div><div class="state-card"><span>执行请求</span><b id="current-request">--</b></div><div class="state-card"><span>任务进度</span><b id="task-progress">--</b></div><div class="state-card"><span>地图版本</span><b id="map-version">--</b></div><h3>当前路线</h3><ol id="route-list" class="route-list"><li>等待规划</li></ol></section>
<section class="panel map-panel" id="map-panel"><div class="panel-heading"><h2>赛道地图</h2><label><input id="truth-toggle" type="checkbox"> 显示仿真真值</label></div><svg id="map" viewBox="0 0 1000 700" role="img" aria-label="赛道拓扑"></svg><div class="legend"><span><i class="unknown"></i>未知</span><span><i class="clear"></i>畅通</span><span><i class="blocked"></i>阻塞</span><span><i class="culvert"></i>涵洞</span><span><i class="truth"></i>真值</span></div></section>
<section class="panel timeline-panel" id="timeline-panel"><div class="panel-heading"><h2>控制与事件</h2><span id="runner-state">未启动</span></div><div class="controls" id="simulation-controls"><button data-command="START">启动</button><button data-command="PAUSE">暂停</button><button data-command="RESUME">继续</button><button data-command="STEP">单步</button><button data-command="STOP" class="danger">停止</button><button data-command="RESET">重置</button></div><div class="timeline" id="timeline"><p class="muted">暂无事件</p></div><h3>诊断</h3><pre id="diagnostics" class="diagnostics">--</pre></section>
</main>
<script src="{{ url_for('static', filename='js/map-view.js') }}"></script><script src="{{ url_for('static', filename='js/timeline.js') }}"></script><script src="{{ url_for('static', filename='js/controls.js') }}"></script><script src="{{ url_for('static', filename='js/websocket.js') }}"></script><script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
